services:
  nifi:
    image: domacker/nifi:1.13.2
    environment:
      #- NIFI_WEB_HTTPS_PORT=8443
      - AUTH=tls
      - KEYSTORE_PATH=/opt/nifi/nifi-current/conf/keystore.jks
      - KEYSTORE_TYPE=JKS
      - KEYSTORE_PASSWORD=changeit
      - TRUSTSTORE_PATH=/opt/nifi/nifi-current/conf/truststore.jks
      - TRUSTSTORE_PASSWORD=changeit
      - TRUSTSTORE_TYPE=JKS
      - INITIAL_ADMIN_IDENTITY='CN=Random User, O=Apache, OU=NiFi, C=US'
    ports:
      - '8443:8443'
      - '8080:8080'
  nifi-registry:
    image: domacker/nifi-registry:0.8.0
    environment:
      #- NIFI_WEB_HTTPS_PORT=8443
      - AUTH=tls
      - KEYSTORE_PATH=/opt/nifi-registry/nifi-registry-current/conf/keystore.jks
      - KEYSTORE_TYPE=JKS
      - KEYSTORE_PASSWORD=changeit
      - TRUSTSTORE_PATH=/opt/nifi-registry/nifi-registry-current/conf/truststore.jks
      - TRUSTSTORE_PASSWORD=changeit
      - TRUSTSTORE_TYPE=JKS
      - INITIAL_ADMIN_IDENTITY='CN=Random User, O=Apache, OU=NiFi, C=US'
    ports:
      - '18443:18443'
      - '18080:18080'
