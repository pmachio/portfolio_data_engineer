version: '3'
services:
  #SPARK
  spark-master:
    image: domacker/spark-master:3.1.2
    ports:
      - '4040:4040'
      - '9090:8080'
      - '7077:7077'
    volumes:
      - ./scripts/spark:/opt/spark_shell_scripts
    environment:
      - 'SPARK_LOCAL_IP=spark-master'
  spark-worker:
    image: domacker/spark-worker:3.1.2
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
      - SPARK_DRIVER_MEMORY=512m
      - SPARK_EXECUTOR_MEMORY=512m
  #SPARK DASHBOARD
  spark-dashboard:
    image: lucacanali/spark-dashboard:v01
    ports:
      #GRAPHANA
      - '3000:3000'
      #GRAPHITE
      - '2003:2003'
    depends_on:
      - spark-worker
  #Para ejemplo de Streaming
  zookeeper:
    image: domacker/zookeeper:3.4
    ports:
      - '2181:2181'
  kafka:
    image: domacker/kafka:2.8.1
    ports:
      - '9092:9092'
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: "INTERNAL://kafka:9090,\
        EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9090,\
        EXTERNAL://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,\
        EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    volumes:
      - ./scripts/kafka:/opt/kafka_2.13-2.8.1/script
    #  - ./data:/opt/kafka_2.13-2.8.1/data
