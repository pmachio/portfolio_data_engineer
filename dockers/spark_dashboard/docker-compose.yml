version: '3'
services:
  #SPARK
  spark-master:
    image: domacker/spark-worker:3.1.2
    ports:
      - '4040:4040'
      - '9090:8080'
      - '7077:7077'
    volumes:
      - ./scripts/spark:/opt/spark_shell_scripts
    environment:
      - 'SPARK_LOCAL_IP=spark-master'
  spark-worker:
    image: domacker/spark-worker:3.1.2
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
      - SPARK_DRIVER_MEMORY=512m
      - SPARK_EXECUTOR_MEMORY=512m
  #SPARK DASHBOARD
  spark-dashboard:
    image: lucacanali/spark-dashboard:v01
    ports:
      #GRAPHANA
      - '3000:3000'
      #GRAPHITE
      - '2003:2003'
